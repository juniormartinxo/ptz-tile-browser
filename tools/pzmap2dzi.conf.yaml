pz_root: |- # project zomboid game folder
    C:/Program Files (x86)/Steam/steamapps/common/ProjectZomboid

output_root: |- # render output folder
    C:/Users/junior/Desktop/PZTileBrowser/map

mod_root: |- # steam workshop folder for project zomboid
    C:/Program Files (x86)/Steam/steamapps/workshop/content/108600

custom_root: |- # custom file folder
    .

save_game_root: |- # save game folder
    %UserProfile%/zomboid/Saves

# for multi map set
# output_entry: map set name
# output_route: map set data path
output_entry: default
output_route: map_data/

# defult map or texture description fields
# (relative from this config file location)
# for b41, use default_b41.txt
map_conf_default: default_b42.txt
# maps and textures description files
# (relative from this config file location)
map_conf:
    - vanilla.txt
    - mod/

# When use_depend_texture_only is set to true, only textures that are declared as
# dependencies in the map's description will be used. This may cause the render
# failure for maps with incomplete dependency descriptions.
# The default setting is false, which means it will try to use all the textures
# available in all declared mods.
use_depend_texture_only: false

# Specify maps to be rendered.
# See vanilla.txt for map names.
# default = Muldraugh, KY
base_map: default

# Additional overlay maps
# See mod/ folder for map names.
mod_maps:
#    - Ashenwood
#    - BedfordFalls
#    - Blueberry
#    - Chinatown
#    - Chinatown expansion
#    - FORTREDSTONE
#    - Grapeseed
#    - Greenleaf
#    - lakeivytownship
#    - Petroville
#    - RavenCreek
#    - Trelai_4x4_Steam

# list of save game folders, the path is relative from save_game_root
# e.g.
# save_games:
#    - Apocalypse/2026-02-26_15-11-44
#    - Sandbox/2026-02-27_20-30-00
#
# or use 'all' to render all save games with same version of the base map
# e.g.
# save_games: all
save_games: all

render_conf:
    # you can customize each setting under render_conf for each job or mod map by using the following syntax:
    #     setting_name[<map name>](<render job>)
    #     setting_name(<render job>)
    #     setting_name[<map name>]
    # examples:
    #     verbose[Bedford Falls](base): false
    #     verbose[default]: true
    #     verbose(zombie): false

    # main conf
    verbose: true
    # show profiling infomation
    profile: false
    # thread count, use 'auto' to set to cpu count
    worker_count: auto
    # set hotkey to stop render (rerun render to resume)
    # hotkey examples:
    #     <ctrl>+<alt>+a    ctrl + alt + a
    #     a                 the key "a"
    #     <f8>              f8
    #     <cmd>+<f2>        windows key + f2
    break_key: ''

    # dzi conf
    # dzi tile size
    tile_size: 1024
    tile_size(foraging): 4096
    tile_size(zombie): 4096

    # make sure map origin (cell 0,0) lies on (0, 0) of a tile
    # for how many bottom levels (minimum allowed is 1)
    # default is 3 bottom levels
    tile_align_levels: 3
    tile_align_levels(foraging): 1
    tile_align_levels(zombie): 1

    # how many layers of map to render
    # examples:
    # render layer 0 to layer 7
    #     layer_range: [0, 8]
    # render layer -32 (basement) to layer 31
    #     layer_range: [-32, 32]
    # render all possible layers
    #     layer_range: all
    layer_range: all

    # hash function for detecting source file changes
    # if omitted or set to null, last modified time will be used for change detection, which is faster but less accurate
    # supported hash functions from hashlib: e.g. md5, sha1, sha256, etc.
    hash_method: null

    # A list of cell ranges to determine the DZI image boundary
    # Each cell range can be specified in two formats:
    #     [x_min, y_min, width, height]
    #     or
    #     [x, y] (equal to [x, y, 1, 1])
    #
    # Special values:
    #     auto (default): automatically detect the cell range based on current map data, which is the default value.
    #     all_mod_maps: use the combined cell range of current map and all mod maps
    #         useful when you want to render save games with mod maps located outside of the vanilla map boundary
    # Examples:
    # default B42 map range:
    #     dzi_cell_range:
    #         - [0, 18, 45, 45]
    #         - [45, 3, 13, 60]
    #         - [58, 0, 20, 63]
    dzi_cell_range[default]: all_mod_maps
    dzi_cell_range: auto

    # A list of cell ranges to render
    # Use similar format as dzi_cell_range, but it only affects the final render output, not the DZI pyramid building.
    # It is used to render a subset of cells from the DZI pyramid built for the whole map.
    # Special value:
    #     all (default): render all cells in the DZI pyramid
    # Examples:
    # render cells in rect (30, 30) to (50, 50) inclusively for default map
    #     render_cell_range[default]:
    #         - [30, 30, 21, 21]
    # render cell (30, 30) only for default map
    #     render_cell_range[default]:
    #         - [30, 30]
    # it is possible to use different settings for specific maps or render jobs, e.g.:
    #     render_cell_range[Bedford Falls](zombie):
    #         - [30, 30, 21, 21]
    #     render_cell_range[Bedford Falls](save):
    #         - [30, 30]
    render_cell_range: all
    render_cell_range[default](base): [[49,25],[42,26],[43,26],[44,26],[45,26],[46,26],[47,26],[41,28],[42,27],[41,27],[44,27],[45,27],[46,27],[47,27],[38,29],[45,32],[23,21],[22,20],[23,20],[22,21],[24,20],[24,21],[25,20],[25,21],[26,20],[26,21],[27,20],[22,22],[28,21],[17,22],[18,22],[20,23],[21,23],[28,23],[28,24],[21,25],[22,25],[42,35],[44,34],[45,34],[46,34],[48,34],[40,36],[41,36],[40,37],[41,37],[42,37],[42,36],[41,38],[42,38],[45,38],[40,39],[41,39],[42,39],[45,39],[42,40],[41,40],[41,41],[42,41],[39,42],[5,21],[6,22],[7,22],[6,23],[7,23],[8,23],[8,22],[9,22],[9,23],[7,24],[8,24],[9,24],[10,24],[15,24],[6,25],[7,25],[8,25],[9,25],[5,26],[9,26],[7,34],[6,35],[1,36],[2,37],[2,36],[1,37],[3,37],[4,37],[1,38],[2,38],[3,38],[7,38],[3,40],[7,41],[6,42],[5,43],[3,44],[11,49],[4,50],[7,52],[12,52],[14,52],[9,54],[8,54],[8,55],[10,55],[10,54],[9,55],[7,55],[8,56],[7,56],[9,56],[10,56],[11,55],[7,57],[8,57],[9,57],[11,56],[11,57],[13,56],[14,57],[11,58],[16,36],[16,37],[15,38],[16,38],[15,39],[7,42],[9,42],[15,42],[10,42],[13,42],[13,43],[14,42],[14,43],[16,45],[8,46],[12,47],[11,48],[49,4],[47,5],[48,5],[48,4],[49,5],[50,5],[50,4],[51,5],[51,4],[52,5],[53,5],[47,6],[48,6],[49,6],[50,6],[51,6],[52,6],[52,7],[53,6],[54,6],[47,8],[47,7],[48,7],[49,7],[49,8],[48,8],[50,7],[50,8],[51,7],[51,8],[52,8],[53,7],[53,8],[46,8],[47,9],[48,9],[49,9],[50,9],[52,9],[53,9],[54,8],[54,9],[48,10],[49,10],[50,10],[52,10],[53,10],[54,10],[55,10],[47,11],[46,11],[48,11],[49,11],[50,11],[51,11],[52,11],[53,11],[54,11],[55,11],[47,12],[49,12],[48,12],[50,12],[51,12],[52,12],[53,12],[54,12],[56,12],[47,13],[48,13],[49,13],[49,14],[50,13],[50,14],[51,13],[52,13],[53,13],[54,13],[48,14],[52,14],[35,48],[38,50],[38,49],[39,49],[39,50],[40,49],[38,51],[39,51],[28,31],[27,32],[28,32],[29,32],[28,33],[33,33],[25,34],[27,35],[31,34],[23,37],[25,36],[27,37],[29,36],[22,37],[26,38],[26,39],[30,39],[31,39],[31,43],[31,44],[30,44],[32,44],[31,45],[32,45],[29,46],[31,46],[32,46],[33,46],[35,46],[31,47],[32,47],[34,47],[35,47],[34,48],[53,14],[49,15],[53,15],[48,16],[49,16],[52,15],[53,16],[49,17],[53,18],[54,18],[50,19],[49,19],[52,19],[54,19],[55,19],[49,20],[48,20],[49,21],[51,20],[50,20],[55,20],[54,21],[49,22],[53,22],[55,21],[55,22],[55,23],[50,24],[54,25]]

    # discard bottom levels to save space at the cost of zoom in resolution
    #
    # Here is an example:
    #     render main map with omit_levels = 2
    #     render other mod maps with omit_levels = 1
    #     render zombie heatmap and top view zombie heatmap of mod map Bedford Fall with omit_levels = 1
    #     all other render with omit_levels = 0
    # Example config:
    #     omit_levels[default](base): 2
    #     omit_levels(base): 1
    #     omit_levels[Bedford Falls](zombie): 1
    #     omit_levels[Bedford Falls](zombie_top): 1
    #     omit_levels: 0
    omit_levels: 0

    # output image format, affect base and all overlay map, mush support transparent
    # supported formats: [png, webp]
    image_fmt: webp

    # output image format for base map layer0, can use jpg to save space
    # supported formats: [png, webp, jpg]
    image_fmt_base_layer0: jpg

    # output image options for each output format
    # more options see:
    #     https://pillow.readthedocs.io/en/stable/handbook/image-file-formats.html#png-saving
    #
    # Here is an example:
    #     use compress level = 1 (fastest) for png
    #     use 95% quality for jpg
    # Example config:
    #     image_save_options:
    #         png: {compress_level: 1}
    #         jpg: {quality: 95}
    image_save_options: {}

    # enable cache to accelerate pyramid building, require python 3.8+
    enable_cache: true
    # cache limit in MB, 0 for unlimited
    cache_limit_mb: 0
    # width for a single tile in top view
    top_view_square_size: 1

    # base render
    plants_conf:
        # eable snow on trees and bushes
        snow: false
        # use large bushes
        large_bush: false
        # eable flower on trees and bushes
        flower: false
        # supported season: spring, summer, summer2, autumn, winter
        season: summer2
        # normal tree size, range from 0 to 3 (inclusive)
        tree_size: 2
        # large tree size, range from 0 to 5 (inclusive)
        jumbo_tree_size: 4
        # large tree type, from: 1 to 11  (inclusive)
        # see _TREE_DEF in pzmap2dzi/plants.py for more detail
        jumbo_tree_type: 1
        # disable ground cover grass
        no_ground_cover: false
        # use only one type of tree
        # supported values:
        # 0        trees not unified
        # 1 to 11   the unified tree type
        unify_tree_type: 0

    # texture filtering
    # contains a list of texture name regex patterns that will NOT be used in the render process
    # example: skip jumbo tree textures
    #     texture_filters:
    #         - '.*JUMBO.*'
    texture_filters: []

    # square color method in top view mode
    # supported method:
    # base: only use the color of the floor tile
    # base+water: only use the color of the floor tile and water tile (if exist)
    # avg: caculate an average color of all tiles
    # carto-zed: Carto-Zed like color theme
    top_view_color_mode: avg
    
    # font settings
    default_font: arial.ttf
    default_font_size: 20
    # room font settings, using default font if omitted
    # room_font: arial.ttf
    # room_font_size: 20

    # zombie heatmap
    zombie_count: true
    # zombie count font settings, using default font if omitted
    # zombie_count_font: arial.ttf
    zombie_count_font_size: 40

    # objects areas
    # objects font settings, using default font if omitted
    # objects_font: arial.ttf
    # objects_font_size: 20

    # foraging & objects color config
    # Possible color value are CSS3-style color specifiers.
    # For more details, see:
    #     https://pillow.readthedocs.io/en/stable/reference/ImageColor.html
    #
    # If the value doesn't provide alpha, default alpha is set:
    #     For foraging default alpha = 128 (50%)
    #     For objects default alpha = 255 (100%)
    #
    # To skip render of a type, set color to 'skip'
    #
    # Example values:
    #       red
    #       '#FF0000'
    #       '#FF000080'
    #       'rgba(255, 0, 0, 128)'
    #       'rgb(255, 0, 0)'
    #       'hsl(0, 100%, 50%)'
    #
    foraging_color_default: Gray
    foraging_color:
        Nav:            White
        TownZone:       Blue
        TrailerPark:    Cyan
        Vegitation:     Yellow
        Forest:         Lime
        DeepForest:     Green
        FarmLand:       Magenta
        Farm:           Red
        ForagingNav:    White          # B42 Road
        Water:          DeepSkyBlue    # B42
        WaterNoFish:    SlateGrey      # B42
        PHForest:       OrangeRed      # B42.4 Acidic Forest
        PHMixForest:    Orange         # B42.4 Acidic Mixed Forest
        PRForest:       ForestGreen    # B42.4 Primary Forest
        FarmMixForest:  Olive          # B42.4 Farmland Forest
        FarmForest:     Orange         # B42.4 Managed Forestry
        BirchForest:    OliveDrab      # B42.4 Birch Forest
        BirchMixForest: DarkOliveGreen # B42.4 Birch Mixed Forest
        OrganicForest:  LawnGreen      # B42.4 Organic Forest

    objects_color_default: White
    objects_color:
        # Special Zombie Spawn Area
        ZombiesType:  Red
        # Car Spawn Area
        ParkingStall: Blue
        # Zone Story
        ZoneStory:    Yellow

    # use mark for room/objects/zombie_count
    use_mark: true

    # streets color
    streets_large:  White
    streets_medium: Cyan
    streets_small:  Teal

    # save game render

    # the release tag of pzdataspec to use for save game parsing
    # options are:
    # - latest: use the latest release version of pzdataspec
    # - local: use save_game_parser_path to load a local copy of parser
    save_game_parser_tag: latest

    # when save_game_parser_tag is set to 'local'
    # save_game_parser_path is the local path to the save game parser
    # when save_game_parser_tag is set to 'latest'
    # the downloaded parser will be cached in save_game_parser_path for future use
    # if left empty, it will default to '<output_path>/lib'
    save_game_parser_path:

    # dump chunks failed to parse during save game rendering for debugging
    save_game_dump_failed_chunks: true
